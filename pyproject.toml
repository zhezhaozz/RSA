[project]
name = "rsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zhe Zhao", email = "zzhaozhe@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.6.0,<5",
    "math-verify>=0.8.0,<1",
    "numpy>=1.26.4,<3",
    "openai-harmony>=0.0.4,<1",
    "pandas>=2.2.3,<4",
    "pyarrow>=17.0.0,<23",
    "reasoning-gym>=0.1.20,<1",
    "tqdm>=4.67.1,<5",
    "transformers>=4.51.0,<6",
    "vllm>=0.10.2,<1",
]

[project.scripts]
rsa = "rsa:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
